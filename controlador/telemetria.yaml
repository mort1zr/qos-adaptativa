# Configuración de la telemetría del controlador (historia PCIII-16).
intervalo_s: 5            # cada cuántos segundos se leen los contadores de los switches de acceso
idle_timeout_s: 30        # un flujo sin tráfico por este tiempo se borra del switch
retencion_flujos_h: 24    # el detalle por flujo (identifica equipos) se borra pasado este tiempo
base_datos: datos/telemetria.db
